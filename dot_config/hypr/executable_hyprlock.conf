source = /home/$USER/.cache/wal/colors-hyprland

general {
    hide_cursor = true
}

# Horizontal display (PIN entry)
background {
    monitor = DP-2
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = .6
}

input-field {
    monitor = DP-2
    size = 9%, 4%
    outline_thickness = 0
    dots_rounding = 4
    dots_spacing = .5
    dots_fase_time = 300
    inner_color = $backgroundCol
    outer_color = $backgroundCol $backgroundCol
    check_color = $backgroundCol $backgroundCol
    fail_color = $backgroundCol $backgroundCol
    font_color = $color9
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = true
    fade_timeout = 2000
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 0
    shadow_size = 10
    rounding = 25
    placeholder_text = <i></i>
    check_text = AUTHENTICATING...
    fail_text = <b>ACCESS DENIED</b>
    fail_color = rgba(80, 0, 0, .5)
    fail_timeout = 300
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor = DP-2
    text = Hello <b>$USER</b>
    color = $color5
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 4
    position = 0, 50
    halign = center
    valign = center
}

# Vertical display (info)
background {
    monitor = DP-1
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = .6
}

background {
    monitor = HDMI-A-1
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = .6
}

label {
    monitor = DP-2
    text = cmd[update:1000] date +"<b>%I</b>:<b>%M</b>"
    color = $color9
    font_size = 120
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 5
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor = DP-2
    text = cmd[update:1000] date +"<b>%A, %B %d, %Y</b>"
    color = $color4
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    shadow_passes = 0
    shadow_size = 4
    position = 0, 350
    halign = center
    valign = center
}

